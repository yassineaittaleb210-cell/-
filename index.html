<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English First Steps — Level A1</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17575F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English A1">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1F0; --side:#DDE6E5; --ink:#15303A; --ink-soft:#48606A;
  --teal:#17575F; --teal-ink:#F1F7F6; --sea:#A9CBCF;
  --buoy:#F0B429; --buoy-ink:#3A2B00; --line:#B7C7C8; --field:#FFFFFF;
  --good:#1E7A4C; --warn:#9A5B00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11242B; --side:#0D1D23; --ink:#E6EFEE; --ink-soft:#9DB3B8;
    --teal:#1B6670; --teal-ink:#F1F7F6; --sea:#356169;
    --buoy:#F0B429; --buoy-ink:#2B2000; --line:#2B454C; --field:#0B181D;
    --good:#5CC48F; --warn:#E5B04C;
  }
}
:root[data-theme="dark"]{
  --paper:#11242B; --side:#0D1D23; --ink:#E6EFEE; --ink-soft:#9DB3B8;
  --teal:#1B6670; --teal-ink:#F1F7F6; --sea:#356169;
  --buoy:#F0B429; --buoy-ink:#2B2000; --line:#2B454C; --field:#0B181D;
  --good:#5CC48F; --warn:#E5B04C;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;font-size:18px;line-height:1.7}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}
.en{font-family:"Bricolage Grotesque","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;text-align:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;padding:18px clamp(16px,4vw,40px);border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:26px;line-height:1.2;font-family:"Bricolage Grotesque","IBM Plex Sans Arabic",system-ui,sans-serif;font-weight:700}
.brand h1 span{display:inline-block;margin-inline-start:10px;padding:1px 10px;border-radius:5px;background:var(--buoy);color:var(--buoy-ink);font-size:16px;vertical-align:middle}
.brand p{margin:2px 0 0;color:var(--ink-soft);font-size:15px}
.tools{margin-inline-start:auto;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;font-size:15px}
.tools label{display:inline-flex;gap:8px;align-items:center}
.tools select{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:210px}

.layout{display:grid;grid-template-columns:310px minmax(0,1fr);max-width:1240px;margin:0 auto}
nav{background:var(--side);border-inline-end:1px solid var(--line);padding:14px 10px;min-height:calc(100vh - 82px)}
nav ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.stage-btn{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;width:100%;text-align:start;
  background:none;border:0;border-radius:6px;padding:10px 12px;cursor:pointer}
.stage-btn:hover{background:color-mix(in srgb,var(--teal) 12%,transparent)}
.stage-btn[aria-current="true"]{background:var(--teal);color:var(--teal-ink)}
.stage-btn .n{font-weight:600;font-variant-numeric:tabular-nums}
.stage-btn .t{font-size:16px;line-height:1.3}
.stage-btn .p{font-size:13px;opacity:.75;font-variant-numeric:tabular-nums;white-space:nowrap}
.menu{display:none;border:1.5px solid var(--line);background:var(--field);border-radius:6px;padding:7px 14px;cursor:pointer}

main{padding:clamp(16px,4vw,40px);min-width:0}
.stage-head .count{margin:0;color:var(--ink-soft);font-size:15px}
.stage-head h2{margin:2px 0 6px;font-size:clamp(28px,4vw,40px);line-height:1.15;font-weight:700}
.stage-head .goal{margin:0;font-size:18px}
.stage-head .fr{margin:2px 0 0;color:var(--ink-soft);font-size:15px;text-align:left}
.stage-head .ar{margin:2px 0 0;color:var(--ink-soft);font-size:16px;text-align:right}

.strip{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:20px 0 24px}
.strip i{height:22px;border-radius:2px;border:1.5px solid var(--line);
  background:repeating-linear-gradient(90deg,transparent 0 5px,color-mix(in srgb,var(--line) 60%,transparent) 5px 6px)}
.strip i.done{border-color:var(--teal);
  background:repeating-linear-gradient(90deg,var(--teal) 0 5px,color-mix(in srgb,var(--teal) 68%,#000) 5px 6px)}
.strip i.now{border:2.5px solid var(--buoy)}

.btn{border:1.5px solid currentColor;background:transparent;border-radius:6px;padding:8px 18px;cursor:pointer;font-weight:500}
.btn:hover{background:color-mix(in srgb,currentColor 10%,transparent)}
.btn.primary{background:var(--buoy);color:var(--buoy-ink);border-color:var(--buoy);font-weight:600}
.btn.primary:hover{background:color-mix(in srgb,var(--buoy) 88%,#000)}
.btn.big{padding:12px 30px;font-size:19px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:transparent}

/* French: hidden until asked */
.frtext,.artext{display:none}
.showfr .frtext,body.fr-all .frtext{display:block}
.showar .artext,body.ar-all .artext{display:block}
.artext{direction:rtl;text-align:right}
.dots{letter-spacing:3px;opacity:.55}
body.fr-all .frbtn{display:none}
body.ar-all .arbtn{display:none}

.say{background:var(--teal);color:var(--teal-ink);border-radius:8px;padding:clamp(18px,3vw,32px)}
.who{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:15px}
.who .name{font-weight:600;font-size:18px}
.line{font-size:clamp(26px,3.6vw,36px);line-height:1.25;font-weight:600;margin:14px 0 8px;transition:filter .2s}
.line.hidden{filter:blur(10px);user-select:none}
.say .frtext{margin:0 0 6px;font-size:19px;opacity:.95;text-align:left}
.say .artext{margin:0 0 6px;font-size:22px;opacity:.95}
.say-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.wave{display:inline-flex;gap:3px;align-items:center;height:26px;margin-inline-start:6px}
.wave i{width:4px;height:6px;border-radius:2px;background:var(--buoy)}
.wave.on i{animation:bar .8s ease-in-out infinite}
.wave.on i:nth-child(2){animation-delay:.12s}.wave.on i:nth-child(3){animation-delay:.24s}
.wave.on i:nth-child(4){animation-delay:.36s}.wave.on i:nth-child(5){animation-delay:.48s}
@keyframes bar{0%,100%{height:6px}50%{height:24px}}
.toggles{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;font-size:15px}
.toggles label{display:inline-flex;gap:8px;align-items:center;cursor:pointer}

/* Word bank */
.words{margin-top:16px;background:var(--field);border:1px solid var(--line);border-inline-start:6px solid var(--buoy);border-radius:8px;padding:clamp(16px,3vw,26px)}
.words h3{margin:0;font-size:20px;font-weight:600}
.words .sub{margin:2px 0 14px;color:var(--ink-soft);font-size:15px}
.chips{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.chip{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden}
.chip .hear{flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.chip .hear:hover{background:color-mix(in srgb,var(--teal) 10%,transparent)}
.chip .cw{display:block;font-size:21px;font-weight:600;line-height:1.25}
.chip .cf{display:block;font-size:15px;color:var(--ink-soft);min-height:1.6em;margin-top:2px}
.chip .dots{display:block}
.showfr .chip .dots,.showar .chip .dots,body.fr-all .chip .dots,body.ar-all .chip .dots{display:none}
.chip .artext{font-size:17px}
.chip .add{flex:none;width:46px;border:0;border-inline-start:1.5px solid var(--line);
  background:color-mix(in srgb,var(--buoy) 26%,transparent);font-size:24px;font-weight:700;cursor:pointer}
.chip .add:hover{background:var(--buoy);color:var(--buoy-ink)}

.reply{margin-top:16px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:clamp(16px,3vw,26px)}
.reply h3{margin:0 0 12px;font-size:20px;font-weight:600}
.mic-row{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.mic{width:60px;height:60px;flex:none;border-radius:50%;border:0;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;cursor:pointer}
.mic:disabled{opacity:.4;cursor:not-allowed}
.mic.on{background:var(--buoy);color:var(--buoy-ink);animation:ring 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(240,180,41,.55)}100%{box-shadow:0 0 0 16px rgba(240,180,41,0)}}
.mic-state{margin:0;font-size:15px;color:var(--ink-soft)}
textarea{width:100%;min-height:96px;resize:vertical;background:var(--paper);border:1px solid var(--line);border-radius:6px;
  padding:12px 14px;font-size:22px;line-height:1.4}
.hint{margin-top:12px;padding:12px 16px;border-radius:6px;background:color-mix(in srgb,var(--buoy) 16%,transparent);border:1px solid color-mix(in srgb,var(--buoy) 50%,transparent)}
.hint p{margin:0 0 8px;font-size:22px;line-height:1.35}
.hint small{display:block;color:var(--ink-soft);font-size:14px;margin-bottom:6px}
.hint .frtext{font-size:17px;color:var(--ink-soft);text-align:left}
.hint .artext{font-size:19px;color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

.fb{margin-top:16px;border:1px solid var(--line);border-inline-start:6px solid var(--sea);background:var(--field);border-radius:6px;padding:16px 20px}
.fb.great{border-inline-start-color:var(--good)}
.fb.ok{border-inline-start-color:var(--warn)}
.fb .ttl{margin:0;font-weight:600;font-size:19px}
.fb .sub{margin:2px 0 10px;color:var(--ink-soft);font-size:15px}
.fb .model{font-size:24px;line-height:1.4;margin:0 0 4px}
.fb .lbl{font-size:14px;color:var(--ink-soft);margin:0}
.fb .frtext{font-size:17px;color:var(--ink-soft);margin:0 0 4px;text-align:left}
.fb .artext{font-size:19px;color:var(--ink-soft);margin:0 0 4px}
mark.hit{background:color-mix(in srgb,var(--good) 24%,transparent);color:inherit;border-radius:3px;padding:0 2px}

.log{margin-top:30px}
.log h3{margin:0 0 10px;font-size:16px;font-weight:500;color:var(--ink-soft)}
.log ol{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.log li{padding-inline-start:14px;border-inline-start:3px solid var(--sea)}
.log p{margin:0;font-size:19px;line-height:1.4}
.log .you{color:var(--ink-soft)}

.intro p{max-width:62ch}
.intro .who-box{margin:18px 0;padding:14px 18px;border-inline-start:5px solid var(--teal);background:color-mix(in srgb,var(--teal) 9%,transparent);border-radius:4px}
.intro .who-box b{font-size:19px}
.intro ol.how{margin:14px 0 20px;padding-inline-start:24px;max-width:62ch}
.intro ol.how li{margin:6px 0}
.done-msg{margin:18px 0 6px;font-size:22px;font-weight:600}

.pager{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.pager .btn{font-size:15px;padding:6px 14px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav{display:none;min-height:0;border-inline-end:0;border-bottom:1px solid var(--line)}
  nav.open{display:block}
  .menu{display:inline-block}
  .tools{margin-inline-start:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button id="menuBtn" class="menu" type="button" aria-expanded="false" aria-controls="stageNav">Dialogues</button>
  <div class="brand">
    <h1>English First Steps <span>A1</span></h1>
    <p>Beginner level. Listen, learn the words, then speak: ten easy dialogues.</p>
  </div>
  <div class="tools">
    <label>Voice
      <select id="voiceSel" dir="ltr"><option value="">Auto</option></select>
    </label>
    <label><input type="checkbox" id="autoPlay" checked> Play audio automatically</label>
    <label><input type="checkbox" id="frAll"> Always show French</label>
    <label><input type="checkbox" id="arAll"> Always show Arabic</label>
  </div>
</header>

<div class="layout">
  <nav id="stageNav" aria-label="Dialogues"><ol id="stageList"></ol></nav>
  <main id="stage"></main>
</div>

    ["Very good! See you soon, Yassine.","Très bien ! À bientôt, Yassine.","Thank you, Sara. See you soon.","Merci, Sara. À bientôt.",[["Thank you","Merci","شكرًا"],["See you soon","À bientôt","أراك قريبًا"]],"جيد جدًا! أراك قريبًا يا ياسين.","شكرًا يا سارة. أراك قريبًا."]
  ]

{
  title:"Where are you from?",
  goal:"Say your country, your city, and your languages.",
  fr:"Dire ton pays, ta ville et tes langues.",
  goalAr:"قل بلدك ومدينتك ولغاتك.",
  who:{"name":"Alex","role":"A traveler"},
  ex:[
    ["Where are you from?","D'où viens-tu ?","I am from Morocco.","Je viens du Maroc.",[["I am from","Je viens de","أنا من"],["Morocco","Maroc","المغرب"]],"من أين أنت؟","أنا من المغرب."],

/* ---------- Helpers ---------- */
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var KEY = 'english-a1-progress-v1';
function loadProg(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ return {}; } }
function saveProg(p){ try{ localStorage.setItem(KEY, JSON.stringify(p)); }catch(e){} }

/* ---------- Speech synthesis (the other person talks) ---------- */
var synth = window.speechSynthesis || null;
var voices = [];
function fillVoices(){
  if(!synth) return;
  voices = synth.getVoices().filter(function(v){ return /^en/i.test(v.lang); });
  var sel = $('#voiceSel');
  sel.innerHTML = '<option value="">Auto</option>' + voices.map(function(v){
    return '<option value="'+esc(v.voiceURI)+'">'+esc(v.name)+' ('+esc(v.lang)+')</option>';
  }).join('');
  sel.value = prefs.voiceURI;
}
function currentVoice(){
  if(!voices.length) return null;
  if(prefs.voiceURI){
    for(var i=0;i<voices.length;i++){ if(voices[i].voiceURI===prefs.voiceURI) return voices[i]; }
  }
  var pref = voices.filter(function(v){ return /en[-_](US|GB)/i.test(v.lang); });
  var pool = pref.length ? pref : voices;
  return pool[state.stage % pool.length];
}
function setWave(on){ var w = $('#wave'); if(w) w.classList.toggle('on', on); }
function speak(text, rate){
  if(!synth) return;
  stopMic();
  synth.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = rate || 1;
  var v = currentVoice();
  if(v){ u.voice = v; u.lang = v.lang; }
  u.onstart = function(){ setWave(true); };
  u.onend = function(){ setWave(false); };
  u.onerror = function(){ setWave(false); };
  setTimeout(function(){ synth.speak(u); }, 60);
}
function stopSpeech(){ if(synth){ synth.cancel(); } setWave(false); }

/* ---------- Speech recognition (you talk) ---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var rec = null, listening = false, baseText = '';
var NO_SR = "This browser cannot hear you. Type your answer in the box (Chrome, Edge or Safari work best).";
function setMicUI(on, msg){
  var m = $('#mic'), s = $('#micState');
  if(m){ m.classList.toggle('on', on); m.setAttribute('aria-pressed', on ? 'true':'false'); m.setAttribute('aria-label', on ? 'Stop recording' : 'Start recording'); }
  if(s && msg) s.textContent = msg;
}
function stopMic(){
  if(rec && listening){ try{ rec.stop(); }catch(e){} }
  listening = false;
}
function toggleMic(){
  var ta = $('#answer');
  if(!SR){ setMicUI(false, NO_SR); return; }
  if(listening){ stopMic(); return; }
  stopSpeech();
  rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 1;
  baseText = ta.value.trim();
  rec.onstart = function(){ listening = true; setMicUI(true, 'I am listening… speak in English.'); };
  rec.onresult = function(e){
    var fin = '', interim = '';
    for(var i=0;i<e.results.length;i++){
      var r = e.results[i];
      if(r.isFinal) fin += r[0].transcript + ' '; else interim += r[0].transcript;
    }
    ta.value = (baseText + ' ' + fin + interim).replace(/\s+/g,' ').trim();
  };
  rec.onerror = function(e){
    var msg = 'Recording problem. Type your answer or try again.';
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed') msg = "I cannot use the microphone. Allow it in your browser, or type your answer in the box.";
    else if(e.error === 'no-speech') msg = "I did not hear anything. Press the microphone and try again.";
    else if(e.error === 'network') msg = 'The microphone needs internet. Type your answer or try again.';
    listening = false; setMicUI(false, msg);
  };
  rec.onend = function(){ listening = false; setMicUI(false, 'Press the microphone to speak again, or edit the words by hand.'); };
  try{ rec.start(); }catch(err){ listening = false; setMicUI(false, "The microphone did not start. Try again."); }
}

/* ---------- Comparison ---------- */
function words(s){ return s.toLowerCase().replace(/[\u2019]/g,"'").replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).filter(Boolean); }
function compare(user, model){
  var us = {}; words(user).forEach(function(w){ us[w] = true; });
  var hits = 0, total = 0;
  var html = model.split(/\s+/).map(function(tok){
    var core = words(tok)[0];
    if(!core) return esc(tok);
    total++;
    if(us[core]){ hits++; return '<mark class="hit">'+esc(tok)+'</mark>'; }
    return esc(tok);
  }).join(' ');
  return { hits:hits, total:total, ratio: total ? hits/total : 0, html:html };
}

/* ---------- French toggle buttons ---------- */
function bindTr(btnSel, secSel, cls, name){
  var b = $(btnSel), sec = $(secSel);
  if(!b || !sec) return;
  b.onclick = function(){
    var on = sec.classList.toggle(cls);
    b.textContent = (on ? 'Hide ' : 'Show ') + name;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  };
}
function bindFr(btnSel, secSel){ bindTr(btnSel, secSel, 'showfr', 'French'); }
function bindAr(btnSel, secSel){ bindTr(btnSel, secSel, 'showar', 'Arabic'); }
function frBtn(id){ return '<button id="'+id+'" class="btn frbtn" type="button" aria-pressed="false">Show French</button>'; }
function arBtn(id){ return '<button id="'+id+'" class="btn arbtn" type="button" aria-pressed="false">Show Arabic</button>'; }

/* ---------- Rendering ---------- */
function cur(){ return STAGES[state.stage]; }

function renderList(){
  $('#stageList').innerHTML = STAGES.map(function(s,i){
    var p = progress[i] || 0;
    return '<li><button class="stage-btn" type="button" data-i="'+i+'" aria-current="'+(i===state.stage)+'">'+
      '<span class="n">'+(i+1)+'</span>'+

      '<span class="p">'+(p>=10 ? '✓ 10/10' : p+'/10')+'</span></button></li>';

}

function pagerHTML(){
  var h = '<div class="pager">'+
    '<button id="prevDialogue" class="btn" type="button"'+(state.stage===0 ? ' disabled' : '')+'>← Previous dialogue</button>';
  if(state.view === 'turn' || state.view === 'done'){
    var can = state.view === 'done' || state.idx > 0;
    h += '<button id="prevExchange" class="btn" type="button"'+(can ? '' : ' disabled')+'>← Previous exchange</button>';
  }
  return h + '</div>';
}
function bindPager(){
  var a = $('#prevDialogue'), b = $('#prevExchange');
  if(a) a.onclick = function(){ if(state.stage > 0) gotoStage(state.stage - 1); };
  if(b) b.onclick = prevExchange;
}
function prevExchange(){
  stopSpeech(); stopMic();
  if(state.view === 'done'){ state.view = 'turn'; state.idx = 9; }
  else if(state.idx > 0){ state.idx--; }
  else return;
  state.log.pop();
  state.lastUser = '';
  render();
  window.scrollTo({top:0});
}

function head(s){
  return '<header class="stage-head">'+
    '<p class="count">Dialogue '+(state.stage+1)+' of '+STAGES.length+'</p>'+
    '<h2 class="en" lang="en" dir="ltr">'+esc(s.title)+'</h2>'+
    '<p class="goal en" lang="en" dir="ltr">'+esc(s.goal)+'</p>'+
    '<p class="fr" lang="fr" dir="ltr">'+esc(s.fr)+'</p>'+
    '<p class="ar" lang="ar" dir="rtl">'+esc(s.goalAr)+'</p>'+

}

function strip(doneCount, nowIdx){
  var h = '';
  for(var i=0;i<10;i++){
    h += '<i class="'+(i<doneCount ? 'done' : (i===nowIdx ? 'now' : ''))+'"></i>';
  }
  return '<div class="strip" role="img" aria-label="'+(nowIdx>=0 ? 'Exchange '+(nowIdx+1)+' of 10' : 'All ten exchanges completed')+'">'+h+'</div>';
}

function logHTML(latestFirst){
  if(!state.log.length) return '';

  var items = state.log.map(function(r){
    return '<li><p class="en" lang="en" dir="ltr"><b>'+esc(s.who.name)+':</b> '+esc(r.p)+'</p>'+
           '<p class="en you" lang="en" dir="ltr"><b>You:</b> '+(r.u ? esc(r.u) : '—')+'</p></li>';
  });
  if(latestFirst) items.reverse();
  return '<section class="log"><h3>Conversation so far</h3><ol>'+items.join('')+'</ol></section>';
}

function render(){
  if(state.view === 'intro') return renderIntro();
  if(state.view === 'done') return renderDone();
  renderTurn();
}

  var s = cur(), p = progress[state.stage] || 0;

function showFeedback(res){
  var s = cur(), ex = s.ex[state.idx], cls = '', ttl, sub = '', model;

    ttl = 'You skipped this one. Listen to the suggested answer, then go on.';
    model = esc(ex[2]);
  } else {
    if(res.ratio >= 0.6){ cls = 'great'; ttl = 'Excellent! Very good!'; }
    else if(res.ratio >= 0.3){ cls = 'ok'; ttl = 'Good try! Look at the suggested answer and say it again.'; }
    else { ttl = 'Nice try. This is normal when you learn. Listen and say the suggested answer.'; }
    sub = 'You said '+res.hits+' of '+res.total+' words from the suggested answer (in green).';
    model = res.html;
  }
  var last = state.idx === 9;
  $('#feedback').innerHTML =
    '<div class="fb '+cls+'">'+
      '<p class="ttl">'+ttl+'</p>'+
      '<p class="sub">'+sub+'</p>'+
      '<p class="lbl">Suggested answer</p>'+
      '<p class="model en" lang="en" dir="ltr">'+model+'</p>'+
      '<p class="frtext" lang="fr" dir="ltr">'+esc(ex[3])+'</p>'+
      '<p class="artext" lang="ar" dir="rtl">'+esc(ex[6])+'</p>'+
      '<div class="actions">'+
        '<button id="hearModel" class="btn" type="button">Listen to the suggested answer</button>'+
        frBtn('frModel')+arBtn('arModel')+
        '<button id="retry" class="btn" type="button">Try again</button>'+
        '<button id="next" class="btn primary" type="button">'+(last ? 'Finish dialogue' : 'Next exchange')+'</button>'+
      '</div>'+
    '</div>';
  $('#actionsRow').hidden = true;
  bindFr('#frModel', '#feedback .fb');
  bindAr('#arModel', '#feedback .fb');
  $('#hearModel').onclick = function(){ speak(ex[2], 0.85); };
  $('#retry').onclick = function(){
    $('#feedback').innerHTML = '';
    $('#actionsRow').hidden = false;
    var ta = $('#answer'); ta.value = ''; ta.focus();
    state.lastUser = '';
    setMicUI(false, 'Press the microphone and try again.');
  };
  $('#next').onclick = next;
  $('#feedback').scrollIntoView({block:'nearest', behavior:'smooth'});
}

function next(){
  stopSpeech(); stopMic();
  var ex = cur().ex[state.idx];
  state.log.push({ p:ex[0], u:state.lastUser, m:ex[2] });
  progress[state.stage] = Math.max(progress[state.stage] || 0, state.idx + 1);
  saveProg(progress);
  state.lastUser = '';
  state.idx++;
  if(state.idx >= 10){ state.view = 'done'; }
  render(); renderList();
  window.scrollTo({top:0});
}

function renderDone(){
  var s = cur(), lastStage = state.stage === STAGES.length - 1;
  mainEl.innerHTML = pagerHTML() + head(s) + strip(10, -1) +
    '<p class="done-msg">'+(lastStage ? 'That was the last dialogue. Well done!' : 'Well done! You finished this dialogue!')+'</p>'+
    '<p>Read the conversation again, then repeat the dialogue for more practice'+(lastStage ? '.' : ' or go to the next one.')+'</p>'+
    '<div class="actions">'+
      (lastStage ? '' : '<button id="nextStage" class="btn primary" type="button">Next dialogue</button>')+
      '<button id="again" class="btn" type="button">Repeat this dialogue</button>'+
    '</div>'+
    logHTML(false);
  bindPager();
  if(!lastStage) $('#nextStage').onclick = function(){ gotoStage(state.stage + 1); };
  $('#again').onclick = function(){ state.view = 'turn'; state.idx = 0; state.log = []; render(); window.scrollTo({top:0}); };
}

function gotoStage(i){
  stopSpeech(); stopMic();
  state.stage = i; state.idx = 0; state.view = 'intro'; state.log = []; state.lastUser = '';
  render(); renderList();
  $('#stageNav').classList.remove('open');
  $('#menuBtn').setAttribute('aria-expanded', 'false');
  window.scrollTo({top:0});
}

/* ---------- Init ---------- */
$('#stageList').addEventListener('click', function(e){
  var b = e.target.closest('.stage-btn');
  if(b) gotoStage(parseInt(b.getAttribute('data-i'), 10));
});
$('#menuBtn').onclick = function(){
  var open = $('#stageNav').classList.toggle('open');
  this.setAttribute('aria-expanded', open ? 'true' : 'false');
};
$('#autoPlay').onchange = function(e){ prefs.auto = e.target.checked; };
$('#frAll').onchange = function(e){ document.body.classList.toggle('fr-all', e.target.checked); };
$('#arAll').onchange = function(e){ document.body.classList.toggle('ar-all', e.target.checked); };
$('#voiceSel').onchange = function(e){ prefs.voiceURI = e.target.value; };
if(synth){ fillVoices(); synth.onvoiceschanged = fillVoices; }
else { $('#autoPlay').parentNode.hidden = true; $('#voiceSel').parentNode.hidden = true; }
renderList();
render();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
